name: Demo CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run pytest -q
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium firefox
      - run: node frontend/node_modules/@playwright/test/cli.js test --config frontend/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            playwright-report
            test-results
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grocery-demo .
      - name: Smoke test container
        run: |
          docker run -d --name grocery -p 8000:8000 -e COOKIE_SECURE=false grocery-demo
          trap 'docker logs grocery; docker rm -f grocery' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS -c /tmp/grocery-cookie -H 'Content-Type: application/json' -d '{}' http://localhost:8000/api/v1/sessions
          curl -fsS -b /tmp/grocery-cookie http://localhost:8000/api/v1/cart
